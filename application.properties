# ==============================================================================
# TRAFFICIQ Spring Boot Application Properties
# ==============================================================================
server.port=8080
spring.application.name=trafficiq-backend

# Database Configuration (MySQL 8.x)
# Defaults connect to localhost:3306/trafficiq_db, overridable via environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trafficiq_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Python Traffic Intelligence Service Integration
python.service.url=${PYTHON_SERVICE_URL:http://localhost:8000}
python.service.connect-timeout-ms=3000
python.service.read-timeout-ms=5000

# Security & JWT Configuration
# Note: In production, generate a secure 256-bit key via environment variable JWT_SECRET
trafficiq.jwt.secret=${JWT_SECRET:TrafficiQSecureSecretKeyForBTechDBMSProject2026HyderabadCorridorToken}
trafficiq.jwt.expiration-ms=86400000

# Logging
logging.level.com.trafficiq=INFO
logging.level.org.springframework.web=INFO
